[package]
name = "Tickeys"
version = "1.0.0"
edition = "2021"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-foundation-sys = "0.8"
objc2 = { version = "0.6", features = ["catch-all"] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSError",
    "NSArray",
    "NSDictionary",
    "NSNotification",
    "NSString",
    "NSTask",
    "NSURL",
    "NSUserDefaults",
] }
objc2-av-foundation = { version = "0.3", features = ["AVAudioPlayer"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSTableView",
    "NSText",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWindowController",
    "NSWorkspace",
] }

[profile.release]
opt-level = 2
